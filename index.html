<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RUN·润">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="RUN · 润：海外移居手册，49 个目的地、141 条路线速查">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>RUN · 润</title>
<style>
:root{--bg:#0b1220;--card:#141e33;--card2:#1b2740;--line:#24324e;--fg:#e8eefb;
--fg2:#9db0cc;--fg3:#6b7f9e;--accent:#38bdf8;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;
--tabh:calc(56px + env(safe-area-inset-bottom))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#05080f;color:var(--fg);overflow-x:hidden;
font:16px/1.6 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;
overscroll-behavior-y:none}
.phone{max-width:520px;width:100%;margin:0 auto;min-height:100vh;min-height:100dvh;
background:var(--bg);position:relative;padding-bottom:var(--tabh);overflow-x:hidden}
.nav{position:sticky;top:0;z-index:9;background:rgba(11,18,32,.94);backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
padding:calc(10px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;gap:12px}
.nav b{font-size:16px}.nav .back{cursor:pointer;color:var(--accent);font-size:22px;line-height:1;
padding:2px 10px 2px 0}
.page{padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.h1{font-size:26px;font-weight:700;letter-spacing:.5px}
.h2{font-size:17px;font-weight:600;margin:22px 0 12px}
.dim{color:var(--fg3);font-size:12px}.muted{color:var(--fg2);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}
.tag{font-size:11px;color:var(--fg2);padding:3px 10px;border:1px solid var(--line);border-radius:999px}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--accent)}.stat span{font-size:10px;color:var(--fg3)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;
transition:.15s}.cell:active{background:var(--card2);border-color:var(--accent);transform:scale(.985)}
.cell .ic{font-size:19px}.cell .t{font-size:14px;font-weight:600;color:var(--accent);margin:6px 0 4px}
.cell .d{font-size:12px;color:var(--fg2);line-height:1.5;min-height:52px}
.cell .h{font-size:11px;color:var(--fg3);margin-top:8px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10px;
background:rgba(56,189,248,.14);color:var(--accent);border:1px solid rgba(56,189,248,.3)}
.badge.dn{background:rgba(29,78,216,.2);color:#93c5fd;border-color:rgba(29,78,216,.4)}
.badge.work{background:rgba(15,118,110,.22);color:#5eead4;border-color:rgba(15,118,110,.4)}
.badge.inv{background:rgba(109,40,217,.22);color:#c4b5fd;border-color:rgba(109,40,217,.45)}
.badge.self{background:rgba(180,83,9,.22);color:#fcd34d;border-color:rgba(180,83,9,.45)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row>*{min-width:0}.row .dim{flex:0 0 auto;white-space:nowrap}
.between{justify-content:space-between}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.g{background:var(--ok)}.y{background:var(--warn)}.r{background:var(--bad)}
.it{border-top:1px solid var(--line);padding:12px 0;cursor:pointer}.it:first-of-type{border-top:none}
.n{font-size:14px;font-weight:600}.s{font-size:12.5px;color:var(--fg2);margin-top:3px;line-height:1.55}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.tile .l{font-size:10px;color:var(--fg3)}.tile .v{font-size:13px;font-weight:600;margin-top:3px;word-break:break-all}
.oneliner{background:linear-gradient(180deg,rgba(56,189,248,.1),rgba(56,189,248,.03));
border:1px solid rgba(56,189,248,.28);border-radius:16px;padding:16px;margin-bottom:16px;font-size:14px}
.oneliner .k{font-size:11px;color:var(--accent);font-weight:600;display:block;margin-bottom:6px}
.fit{border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.fit.ok{background:rgba(52,211,153,.06);border-color:rgba(52,211,153,.25)}
.fit.no{background:rgba(248,113,113,.06);border-color:rgba(248,113,113,.22)}
.fit .fh{font-size:12px;font-weight:600;margin-bottom:8px}.fit .fi{font-size:12.5px;color:var(--fg2);line-height:1.7}
.tl{border-left:2px solid var(--line);margin-left:14px;padding-left:18px}
.tli{position:relative;padding-bottom:16px}
.tli .num{position:absolute;left:-34px;top:0;width:28px;height:28px;border-radius:50%;
background:var(--card2);border:2px solid var(--accent);color:var(--accent);font-size:11px;
display:flex;align-items:center;justify-content:center}
.tli .tt{font-size:14px;font-weight:600}.tli .td{font-size:12.5px;color:var(--fg2);margin-top:3px}
.ck{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.box{width:20px;height:20px;border-radius:5px;border:1px solid var(--line);flex:0 0 auto;
display:flex;align-items:center;justify-content:center;font-size:12px;color:#04121f;margin-top:2px}
.box.on{background:var(--ok);border-color:var(--ok)}
.ckt{font-size:13.5px;flex:1;line-height:1.55}.ckt.done{color:var(--fg3);text-decoration:line-through}
.warn{background:rgba(251,191,36,.05);border-color:rgba(251,191,36,.22)}
.note{font-size:12.5px;color:var(--fg2);line-height:1.8}
.src{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.src .st{font-size:12px}.src .su{font-size:11px;color:var(--accent);word-break:break-all;margin-top:2px}
.kpi{display:flex;gap:8px;margin-bottom:14px}.kp{flex:1;background:var(--card);border:1px solid var(--line);
border-radius:10px;padding:10px}.kp .l{font-size:10px;color:var(--fg3)}.kp .v{font-size:12px;font-weight:600;margin-top:3px}
.foot{text-align:center;color:var(--fg3);font-size:11px;line-height:1.8;padding:24px 18px 40px}
.tab{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
background:rgba(15,23,42,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
border-top:1px solid var(--line);display:flex;z-index:10;
padding-bottom:env(safe-area-inset-bottom)}
.tab div{flex:1;text-align:center;padding:8px 0 8px;font-size:11px;color:var(--fg3);cursor:pointer}
.tab div.on{color:var(--accent)}.tab div i{display:block;font-size:17px;font-style:normal;margin-bottom:1px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;
-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:12px;color:var(--fg2);padding:6px 13px;border:1px solid var(--line);
border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:#04121f;border-color:var(--accent);font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
border-radius:999px;padding:9px 14px;margin-bottom:12px}
.search input{flex:1;background:none;border:0;outline:none;color:var(--fg);font-size:16px}
.search input::placeholder{color:var(--fg3)}
.slogan{font-size:12.5px;color:var(--fg2);margin-top:8px;line-height:1.55}
.btn{width:100%;padding:14px;border-radius:999px;background:var(--card2);color:var(--accent);
border:1px solid var(--line);font-size:14px;cursor:pointer;margin-top:8px}
.btn.fav{color:var(--warn);border-color:rgba(251,191,36,.4)}
.empty{text-align:center;color:var(--fg3);font-size:13px;padding:60px 20px}
</style></head><body>
<div class="phone" id="app"><div class="empty">加载中…</div></div>
<div class="tab" id="tab"></div>
<script src="runpack.js"></script>
<script>
const P = window.__PACK;
if (!P) { document.getElementById('app').innerHTML =
  '<div class="empty">数据未加载：请确认 runpack.js 与 index.html 同目录</div>'; }
else {
const IDX = P.index, META = IDX.meta, ST = META.stats;
const TYPES={'digital-nomad':['数字游民','dn','💻'],work:['技术工作','work','🧑‍💻'],
'residence-by-investment':['投资居留','inv','💰'],'self-employed':['创业自雇','self','🚀'],
startup:['创业签证','self','🌱'],citizenship:['入籍','other','🛂'],other:['其他','other','📄']};
const tinfo=t=>TYPES[t]||TYPES.other;
const sdot=s=>s==='open'?['g','开放']:s==='closed'?['r','已关闭']:s==='tighter'?['y','收紧']:['y','待核'];
const KIND={new:'新开',closed:'关闭',tighter:'收紧',looser:'放宽'};
const PROFILES=[['digital-nomad','💻','数字游民','为境外雇主或客户远程工作，想换个国家生活','18 条路线 · 门槛最低'],
['work','🧑‍💻','技术工作 · 蓝卡','拿到当地雇主 offer，工作转居留、永居、入籍','73 条路线 · 最快 21 个月永居'],
['study','🎓','留学 → 工作 → 移民','毕业后拿工签，再转工作签证','德国 18 个月 · 芬兰 2 年'],
['self-employed','🚀','创业 · 自雇','在当地开公司、做自由职业','爱沙尼亚 · 荷兰 · 丹麦…'],
['passive','🏖️','被动收入 · 退休','靠养老金、租金、存款生活，不在当地工作','葡萄牙 D7 · 西班牙 DNV'],
['residence-by-investment','💰','投资居留 · 入籍','用投资换身份，住得少也能保持','希腊 · 塞浦路斯 · 马耳他']];
const LBL=[['col','生活成本'],['rent','房租指数'],['safety','安全指数'],['salary','平均年薪'],
['tax','最高个税'],['passport','护照免签'],['pr','永居年限'],['cit','入籍年限'],
['dual','双重国籍'],['lang','语言要求'],['entry','中国护照']];

let favs=new Set(JSON.parse(localStorage.getItem('run:fav')||'[]'));
let filter={region:'',type:'',kw:'',sort:'col'};
let scrollPos={};

const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem('run:fav',JSON.stringify([...favs]));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tiles=prof=>LBL.filter(([k])=>prof[k]!==undefined&&prof[k]!=='').map(([k,l])=>
  `<div class="tile"><div class="l">${l}</div><div class="v">${esc(prof[k])}</div></div>`).join('');

function viewHome(){
  const feat=['portugal','spain','germany','netherlands','estonia','italy']
    .map(s=>IDX.countries.find(c=>c.slug===s)).filter(Boolean);
  return `<div class="nav"><b>RUN · 润</b></div><div class="page">
  <div class="h1">RUN · 润</div><div class="muted">一本海外移居手册</div>
  <div class="tags">${META.tagline.split(' · ').map(t=>`<span class="tag">${t}</span>`).join('')}</div>
  <div class="stats">
    <div class="stat"><b>${ST.countries}</b><span>目的地</span></div>
    <div class="stat"><b>${ST.routes}</b><span>移民路线</span></div>
    <div class="stat"><b>${ST.sources}</b><span>官方来源</span></div></div>
  <div class="dim">数据核查 ${ST.verifiedFrom} ~ ${ST.verifiedTo} · ${META.license}</div>
  <div class="card" style="margin-top:18px">
    <div class="row between"><b style="font-size:15px">⏱ 规则变动</b><span class="dim">近 3 条</span></div>
    ${P.changes.slice(0,3).map(c=>`<div class="it" onclick="go('#/country/${c.slug||c.global}')">
      <div class="row" style="align-items:flex-start"><span style="font-size:17px">${c.flag}</span>
      <div style="flex:1"><div class="row"><b style="font-size:13px">${esc(c.country)}</b>
      <span class="badge">${KIND[c.kind]||'变动'}</span>
      <span class="dim" style="margin-left:auto">${c.date}</span></div>
      <div class="s">${esc(c.text)}</div></div></div></div>`).join('')}</div>
  <div class="h2">🧭 你是哪种情况？</div>
  <div class="grid">${PROFILES.map(([k,ic,t,d,h])=>`<div class="cell" onclick="pickProfile('${k}')">
    <div class="ic">${ic}</div><div class="t">${t}</div><div class="d">${d}</div><div class="h">${h}</div></div>`).join('')}</div>
  <div class="h2">🇪🇺 欧洲热门</div>
  ${feat.map(c=>`<div class="card" style="cursor:pointer" onclick="go('#/country/${c.slug}')">
    <div class="row"><span style="font-size:17px">${c.flag}</span><b style="font-size:14px">${esc(c.name)}</b>
    <span class="dim" style="margin-left:auto">›</span></div>
    <div class="slogan">${esc(c.tagline)}</div>
    <div class="row" style="margin-top:10px"><span class="badge">${c.routeCount} 条路线</span>
    ${c.pr?`<span class="dim">永居 ${esc(c.pr)}</span>`:''}</div></div>`).join('')}
  <div class="foot">内容来自开源项目 RUN · 润，CC BY-SA 4.0<br>仅供参考，不构成移民 / 法律 / 税务 / 投资建议</div></div>`;
}

function searchBox(v){return `<div class="search"><span>🔍</span>
  <input id="q" placeholder="国家 / 路线 / 门槛，如 葡萄牙、25 万欧" value="${esc(v)}"
   oninput="filter.kw=this.value;renderCountriesOnly()"></div>`;}

function itemRow(flag,name,sub,kind,slug,k){
  return `<div class="card" style="cursor:pointer" onclick="go('#/${kind}/${slug}')">
    <div class="row"><span style="font-size:16px">${flag}</span><b style="font-size:13.5px">${esc(name)}</b>
    <span class="dim" style="margin-left:auto">${k} ›</span></div><div class="s">${esc(sub)}</div></div>`;
}

function viewCountries(){
  const kw=filter.kw.trim().toLowerCase();
  let body;
  if(kw){
    const kwNum=/\d/.test(kw)?numOf(kw):null;
    const cs=IDX.countries.filter(c=>`${c.name}${c.nameEn||''}${c.tagline||''}`.toLowerCase().includes(kw));
    const rs=IDX.routes.filter(r=>`${r.title}${r.country}${r.threshold||''}`.toLowerCase().includes(kw)
      || (r.threshold&&kwNum!==null&&thHit(r.threshold,kwNum)));
    body=`<div class="dim" style="margin:8px 0">${cs.length+rs.length} 条结果</div>
      ${cs.map(c=>itemRow(c.flag,c.name,c.tagline,'country',c.slug,'国家')).join('')}
      ${rs.map(r=>itemRow(r.flag,r.title,r.country+' · '+(r.threshold||'门槛见详情'),'route',r.slug,'路线')).join('')}`
      || '<div class="empty">没有匹配</div>';
    return `<div class="nav"><b>搜索</b></div><div class="page">${searchBox(filter.kw)}${body}</div>`;
  }
  let list=IDX.countries;
  if(filter.region) list=list.filter(c=>c.region===filter.region);
  if(filter.type) list=list.filter(c=>c.types.includes(filter.type));
  const srt={col:(a,b)=>(a.col||999)-(b.col||999),name:(a,b)=>a.name.localeCompare(b.name,'zh'),
             routes:(a,b)=>b.routeCount-a.routeCount};
  list=[...list].sort(srt[filter.sort]);
  const typeChips=[...new Set(IDX.routes.map(r=>r.routeType))];
  return `<div class="nav"><b>目的地</b></div><div class="page">
  ${searchBox(filter.kw)}
  <div class="chips">${[['','全部'],['europe','欧洲 36'],['global','全球 13']].map(([k,l])=>
    `<div class="chip ${filter.region===k?'on':''}" onclick="setFilter('region','${k}')">${l}</div>`).join('')}</div>
  <div class="chips">${typeChips.map(t=>`<div class="chip ${filter.type===t?'on':''}"
    onclick="setFilter('type','${filter.type===t?'':t}')">${tinfo(t)[2]} ${tinfo(t)[0]}</div>`).join('')}</div>
  <div class="row between" style="margin-bottom:10px"><span class="dim">${list.length} 个目的地</span>
  <div class="row" style="gap:10px">${[['col','生活成本'],['routes','路线多'],['name','名称']].map(([k,l])=>
    `<span style="cursor:pointer;font-size:12px;color:${filter.sort===k?'var(--accent)':'var(--fg3)'}"
     onclick="setFilter('sort','${k}')">${l}</span>`).join('')}</div></div>
  ${list.map(c=>`<div class="card" style="cursor:pointer" onclick="go('#/country/${c.slug}')">
    <div class="row"><span style="font-size:17px">${c.flag}</span>
      <div style="flex:1"><b style="font-size:14px">${esc(c.name)}</b>
      <span class="dim">${esc(c.nameEn||'')}</span><div class="s">${esc(c.tagline)}</div></div>
      <span class="dim">›</span></div>
    <div class="row" style="margin-top:9px;flex-wrap:wrap;gap:8px">
      <span class="badge">${c.routeCount} 条路线</span>
      ${c.pr?`<span class="dim">永居 ${esc(c.pr)}</span>`:''}
      ${c.cit?`<span class="dim">入籍 ${esc(c.cit)}</span>`:''}
      <span class="dim">${esc(c.entry||'')}</span></div></div>`).join('')}
  <div class="foot">门槛逐年调整，递交前以官方页面为准</div></div>`;
}

function viewCountry(slug){
  const d=P.countries[slug]; if(!d) return `<div class="nav"><span class="back" onclick="back()">‹</span></div>
    <div class="page"><div class="empty">未找到</div></div>`;
  return `<div class="nav"><span class="back" onclick="back()">‹</span><b>${esc(d.name)}</b></div>
  <div class="page">
  <div class="row"><span style="font-size:26px">${d.flag}</span>
    <div><div class="h1" style="font-size:22px">${esc(d.name)}</div>
    <div class="dim">${esc(d.nameEn)} · ${d.region==='europe'?'欧洲':'全球'}</div></div></div>
  <div class="slogan" style="margin-top:12px">${esc(d.tagline)}</div>
  ${d.oneLiner?`<div class="oneliner" style="margin-top:14px"><span class="k">一句话判断</span>${esc(d.oneLiner)}</div>`:''}
  <div class="tiles">${tiles(d.profile||{})}</div>
  <div class="dim" style="margin:10px 0 4px">Numbeo 2026 年中、Eurostat、Tax Foundation 2026、Henley 2026</div>
  <div class="h2">📊 ${d.routes.length} 条路线</div>
  ${d.routes.map(r=>{const t=tinfo(r.routeType),[dt,dtt]=sdot(r.status);return `
    <div class="card" style="cursor:pointer" onclick="go('#/route/${r.slug}')">
      <div class="row between"><span class="badge ${t[1]}">${t[2]} ${t[0]}</span>
        <span class="row" style="gap:5px"><span class="dot ${dt}"></span><span class="dim">${dtt}</span></span></div>
      <div style="font-size:14px;font-weight:600;margin:9px 0 5px">${esc(r.title)}</div>
      <div class="s">${esc(r.summary||'')}</div>
      <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:8px">
        ${r.threshold?`<span class="dim">门槛 ${esc(r.threshold)}</span>`:''}
        ${r.family?`<span class="dim">${esc(r.family)}</span>`:''}
        ${r.pr?`<span class="dim">${esc(r.pr)}</span>`:''}
        ${r.verified?`<span class="dim">核查 ${r.verified}</span>`:''}</div></div>`}).join('')}
  ${d.deepDive?`<div class="card"><div class="h2" style="margin-top:0">📖 深度解读</div>
    <div class="muted" style="white-space:pre-wrap;font-size:12.5px;line-height:1.8">${esc(d.deepDive)}</div></div>`:''}
  <div class="foot">内容 CC BY-SA 4.0 · 来源 BryceYuuu/RUN · 仅供参考</div></div>`;
}

function viewRoute(slug){
  const r=P.routes[slug]; if(!r) return `<div class="nav"><span class="back" onclick="back()">‹</span></div>
    <div class="page"><div class="empty">未找到</div></div>`;

  ${r.fit.length?`<div class="fit ok"><div class="fh">✅ 适合</div>

  ${r.notFit.length?`<div class="fit no"><div class="fh">❌ 不适合</div>
    ${r.notFit.map(x=>`<div class="fi">· ${esc(x)}</div>`).join('')}</div>`:''}
  ${tl.length?`<div class="h2">🗺️ 申请流程</div><div class="tl">${tl.map((s,i)=>`
    <div class="tli"><div class="num">${i+1}</div><div class="tt">${esc(s.title)}</div>
    ${s.detail?`<div class="td">${esc(s.detail)}</div>`:''}</div>`).join('')}</div>`:''}
  ${r.checklist.length?`<div class="h2">📋 材料清单 <span class="dim">点一下打勾</span></div>
    ${r.checklist.map((c,i)=>`<div class="ck" onclick="toggleCk('${ckKey}',${i})">
      <div class="box ${ck[i]?'on':''}">${ck[i]?'✓':''}</div>
      <div class="ckt ${ck[i]?'done':''}">${esc(c)}</div></div>`).join('')}`:''}
  ${r.notes.length?`<div class="card warn" style="margin-top:14px"><b style="font-size:14px">⚠️ 注意</b>

  ${(r.officialSources||r.sources||[]).map(s=>`<a class="src" href="${esc(s.url)}" target="_blank"

// ---------- 数字门槛匹配 ----------
function numOf(str){
  const m=String(str).replace(/[,，\s]/g,'').match(/(\d+(?:\.\d+)?)\s*(万|千|k|m)?/i);
  if(!m)return null;
  const n=parseFloat(m[1]),u=(m[2]||'').toLowerCase();
  return Math.round(n*(u==='万'?1e4:u==='千'||u==='k'?1e3:u==='m'?1e6:1));
}
function thHit(th,n){
  if(!th||n===null)return false;
  const t=numOf(th);return t!==null&&Math.abs(t-n)/Math.max(t,1)<0.02;
}

// ---------- 路由 ----------
let stack=['#/home'];
function renderTab(){
  const cur=(location.hash||'#/home').split('/')[1]||'home';
  const t=[['home','🧭','我该怎么走'],['countries','🌍','国家'],['more','⏱','变更']];
  $('tab').innerHTML=t.map(([k,i,l])=>
    `<div class="${cur===k?'on':''}" onclick="location.hash='#/${k}'"><i>${i}</i>${l}</div>`).join('');
}
function render(){
  const h=(location.hash||'#/home').replace(/^#\/?/,'').split('/');
  const key=location.hash||'#/home';
  if(scrollPos[lastKey]!==undefined && lastKey) scrollPos[lastKey]=window.scrollY;
  let html;
  if(h[0]==='country') html=viewCountry(h[1]);
  else if(h[0]==='route') html=viewRoute(h[1]);
  else if(h[0]==='countries') html=viewCountries();
  else if(h[0]==='more') html=viewMore();
  else html=viewHome();
  $('app').innerHTML=html;
  renderTab();
  window.scrollTo(0,scrollPos[key]||0);
  lastKey=key;
}
let lastKey='';
function renderCountriesOnly(){
  if((location.hash||'').startsWith('#/countries')){ $('app').innerHTML=viewCountries(); }
}
function go(h){stack.push(h);location.hash=h;}
function back(){
  stack.pop();
  location.hash=stack[stack.length-1]||'#/home';
}
function setFilter(k,v){
  filter[k]=v;
  if(k==='kw'){renderCountriesOnly();return;}
  render();
}
function pickProfile(k){
  filter = (k==='study'||k==='passive')
    ? {...filter,type:'',kw:k==='study'?'留学':'退休'}
    : {...filter,type:k,kw:''};
  location.hash='#/countries';
}
function toggleCk(key,i){
  const ck=JSON.parse(localStorage.getItem(key)||'{}');
  ck[i]=!ck[i];localStorage.setItem(key,JSON.stringify(ck));render();
}
function toggleFav(s){
  favs.has(s)?favs.delete(s):favs.add(s);save();render();
}
window.addEventListener('hashchange',render);
if(!location.hash)location.hash='#/home';
render();

// ---------- PWA ----------
if('serviceWorker' in navigator && location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
}
